; cava for the shell's visualizers: raw numbers out, nothing drawn.
; Edit: framerate and smoothing here; band count in services/Cava.qml.

[general]
framerate = 60
bars = 32
autosens = 1
sleep_timer = 2

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 70
